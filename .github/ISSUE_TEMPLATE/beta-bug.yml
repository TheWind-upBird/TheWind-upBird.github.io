name: Beta Bug
description: 报告朋友内测中的可复现故障或阻塞
title: "[beta-bug] "
labels: ["beta", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        请不要粘贴个人信息、访问令牌、私人代码或笔记正文。安全漏洞请使用仓库的私密漏洞报告入口。
  - type: input
    id: version
    attributes:
      label: SolveShift 版本
      description: 可在“工具与设置 → 发布与信任”查看。
      placeholder: 0.4.0-beta.2
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 影响程度
      options:
        - P0 · 数据丢失、安全或全站不可用
        - P1 · 核心任务无法完成
        - P2 · 严重但有绕过方式
        - P3 · 轻微问题
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 设备与浏览器
      placeholder: Windows 11 / Chrome 版本；iPhone / Safari 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 输入不含私人内容的最小示例……
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除个人信息、私人代码、笔记、测试输入和敏感日志。
          required: true
