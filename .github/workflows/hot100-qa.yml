name: Hot100 QA

on:
  push:
    paths:
      - 'public/hot100/**'
      - 'scripts/hot100-qa.mjs'
      - 'scripts/hot100-qa.py'
      - 'scripts/hot100-pwa-qa.mjs'
      - 'scripts/hot100-study-modes-qa.mjs'
      - 'scripts/hot100-scaffold-qa.mjs'
      - 'scripts/python-content-qa.py'
      - 'package.json'
      - '.github/workflows/hot100-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run SolveShift release content gates
        run: npm run qa:hot100
