name: Hot100 QA

on:
  push:
    paths:
      - 'public/hot100/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/hot100-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hot100-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run the complete SolveShift release gate
        run: npm run release:check
      - name: Generate release evidence
        run: npm run release:evidence -- --out release-evidence.json
      - name: Preserve release evidence
        uses: actions/upload-artifact@v4
        with:
          name: solveshift-release-evidence-${{ github.sha }}
          path: release-evidence.json
          retention-days: 30
